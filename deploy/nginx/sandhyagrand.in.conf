# ─────────────────────────────────────────────────────────────────────────────
# Public website — sandhyagrand.in (+ www)
# Serves the static Create React App bundle from website/build. Pure static host;
# the site's /api and /uploads calls go cross-origin to https://admin.sandhyagrand.in
# (baked in at build time via REACT_APP_API_URL), so nothing is proxied here.
#
# After copying this file in place, run:
#   sudo certbot --nginx -d sandhyagrand.in -d www.sandhyagrand.in
# certbot rewrites this file to add the TLS (listen 443) block and the
# HTTP→HTTPS redirect. Do NOT hand-write ssl_certificate paths before that.
#
# certbot did NOT add HSTS, despite what this comment used to claim -- the live
# 443 block had no Strict-Transport-Security at all. It is set explicitly in the
# snippet now rather than left to a tool that may or may not add it.
#
# Requires: deploy/nginx/snippets/security-headers.conf copied to
#   /etc/nginx/snippets/security-headers.conf
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name sandhyagrand.in www.sandhyagrand.in;

    root /var/www/sandhyagrand/website/build;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2;

    # Security headers. Declared at server level AND repeated inside every
    # location that sets a header of its own -- nginx discards all inherited
    # add_headers as soon as a location declares one. See the snippet.
    include /etc/nginx/snippets/security-headers.conf;

    # Fingerprinted assets are safe to cache forever.
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        # One Cache-Control, not two: `expires 1y` emits its own, so pairing it
        # with an add_header sent the asset two conflicting Cache-Control lines.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # SPA deep-link fallback: /booking, /room-service/101, … → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or new deploys won't be picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    client_max_body_size 2m;
}
