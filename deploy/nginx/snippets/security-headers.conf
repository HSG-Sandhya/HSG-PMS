# ─────────────────────────────────────────────────────────────────────────────
# Security headers for the public site.
#
# WHY THIS IS A SEPARATE FILE, INCLUDED IN EVERY LOCATION:
#
# nginx's add_header is not additive across levels. The moment a `location`
# declares an add_header of its own, it DISCARDS every add_header inherited
# from the server block. That is documented behaviour, and it is silent.
#
# The site had these three headers declared once at server level. But the two
# locations that matter both set their own Cache-Control, so both dropped the
# lot — and `location /` ends in `try_files … /index.html`, an internal
# redirect into `location = /index.html`, which also sets Cache-Control. The
# net effect was that every HTML page and every JS/CSS asset was served with
# NO security headers at all. Only incidental files like /robots.txt, whose
# location sets no header, still carried them.
#
# So: one copy here, `include`d everywhere, because the copies must exist and
# must not be allowed to drift.
# ─────────────────────────────────────────────────────────────────────────────

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Matches what the admin host already sends. All three names on this box
# (sandhyagrand.in, www, admin) are on one certificate and all serve HTTPS
# only, so includeSubDomains cannot strand anything.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# REPORT-ONLY on purpose. This policy is believed correct, but it governs the
# Razorpay checkout flow — real guests paying real money — and the only way to
# prove it end to end is to take a live payment. Report-Only enforces nothing
# and breaks nothing; violations appear in the browser console.
#
# To promote it: complete one real booking with devtools open, confirm the
# console is clean, then rename the header to Content-Security-Policy.
#
#   script-src   checkout.razorpay.com — Booking.js and PaymentGateway.js
#                inject the checkout script at runtime
#   frame-src    Razorpay opens its checkout in an iframe; www.google.com is
#                the map embed on the Contact page
#   connect-src  admin.sandhyagrand.in is the API (cross-origin by design,
#                baked in at build time); lumberjack is Razorpay's telemetry
#   style-src    'unsafe-inline' is required by React's inline styles and by
#                the CRA-emitted <style> blocks; removing it needs nonces,
#                which a static host cannot generate
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://admin.sandhyagrand.in; connect-src 'self' https://admin.sandhyagrand.in https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.google.com; upgrade-insecure-requests" always;
