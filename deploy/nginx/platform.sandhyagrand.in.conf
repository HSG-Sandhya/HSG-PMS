# ─────────────────────────────────────────────────────────────────────────────
# PMS control plane — platform.sandhyagrand.in
#
# The Node/Express control plane (PM2 app "sandhya-platform") listens on
# 127.0.0.1:5100 and serves BOTH the operator API (/api/platform, /health) and
# the operator console (platform/public/console). nginx only reverse-proxies.
#
# ⚠ THIS IS THE MOST PRIVILEGED SURFACE IN THE DEPLOYMENT. A session here can
#   create, suspend and reconfigure every hotel. It is not the admin panel for
#   one hotel — it is the panel that owns all of them.
#
#   The `allow`/`deny` block below is therefore ON by default: the login form is
#   the second line of defence, not the first. Put your office/VPN/home IPs in
#   it. If you genuinely need it reachable from anywhere, comment the block out
#   and understand that a single leaked password then owns every tenant.
#
# After copying this file in place:
#   sudo certbot --nginx -d platform.sandhyagrand.in
#
# DNS: add an A record  platform.sandhyagrand.in -> <VPS public IP>
#      (the same host as the hotel API; this is a separate vhost, not a server)
#
# NOTE: `map` defines $connection_upgrade in the http context. If nginx reports
# "duplicate map", delete this block and keep the existing one.
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name platform.sandhyagrand.in;

    # ── Network-level access control ─────────────────────────────────────────
    # Replace these with the addresses that should be able to reach the control
    # plane at all. Everything else gets 403 before it ever sees the login form.
    #   allow 203.0.113.10;      # office
    #   allow 198.51.100.0/24;   # VPN range
    # Leaving ONLY `deny all` here means nobody can reach it — intentional, so a
    # copied-but-unedited file fails closed rather than exposing the console.
    allow 127.0.0.1;
    deny all;

    # The console is a small static bundle; no large uploads happen here.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Real client info — REQUIRED for express-rate-limit to key on the
        # actual caller. Without X-Forwarded-For every request appears to come
        # from 127.0.0.1 and one visitor's failures would lock out everyone.
        # The app sets `trust proxy` in production to read these.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
